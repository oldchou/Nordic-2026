<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北歐之旅 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── 這個檔案不含任何行程資料，只負責樣式與渲染 ── */
:root {
  --bg:    #faf6f0;
  --bg2:   #ffffff;
  --bg3:   #f2e8dc;
  --bg4:   #e8d8c8;
  --text:  #1c1510;
  --text2: #7a5a48;
  --text3: #a88878;
  --border:  rgba(139,58,42,0.12);
  --border2: rgba(139,58,42,0.22);

  --blue:        #2E4A6B;
  --blue-dim:    rgba(46,74,107,0.09);
  --blue-border: rgba(46,74,107,0.22);

  --green:        #8B3A2A;
  --green-dim:    rgba(139,58,42,0.08);
  --green-border: rgba(139,58,42,0.2);

  --orange:        #96580A;
  --orange-dim:    rgba(150,88,10,0.09);
  --orange-border: rgba(150,88,10,0.22);

  --purple:        #1E3A5A;
  --purple-dim:    rgba(30,58,90,0.09);
  --purple-border: rgba(30,58,90,0.2);

  --red:        #C4614A;
  --red-dim:    rgba(196,97,74,0.09);
  --red-border: rgba(196,97,74,0.22);
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans TC',sans-serif; font-size:15px; line-height:1.6; min-height:100vh; }

header {
  background:var(--blue);
  padding:1.5rem 1.25rem 1.2rem;
  text-align:center;
  position:relative;
  overflow:hidden;
}
header::before {
  content:'';
  position:absolute; inset:0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 18px, rgba(255,255,255,0.04) 18px, rgba(255,255,255,0.04) 19px),
    repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(255,255,255,0.04) 38px, rgba(255,255,255,0.04) 39px);
  pointer-events:none;
}
.header-label { font-size:10px; letter-spacing:0.22em; color:rgba(200,216,232,0.75); text-transform:uppercase; margin-bottom:0.35rem; position:relative; }
header h1 { font-family:'Noto Serif TC',serif; font-size:1.6rem; font-weight:600; color:#ffffff; line-height:1.3; position:relative; }
.header-sub { font-size:12px; color:rgba(200,216,232,0.8); margin-top:0.2rem; position:relative; }
.badges { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin-top:0.85rem; position:relative; }
.badge { display:inline-flex; align-items:center; gap:5px; border-radius:20px; padding:3px 11px; font-size:11px; }
.badge-harbor { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#ffffff; }
.badge-brick  { background:rgba(139,58,42,0.3);   border:1px solid rgba(196,97,74,0.5);   color:#f2c8b8; }
.dot { width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; }

.days-nav {
  display:flex; overflow-x:auto;
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:0 0.4rem; scrollbar-width:none;
  position:sticky; top:0; z-index:50;
  box-shadow:0 1px 4px rgba(0,0,0,0.05);
}
.days-nav::-webkit-scrollbar { display:none; }
.day-tab {
  flex-shrink:0; padding:0.55rem 0.85rem;
  font-size:11.5px; color:var(--text2);
  cursor:pointer; border-bottom:2px solid transparent;
  transition:all 0.18s; white-space:nowrap; text-align:center; line-height:1.4;
}
.day-tab.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:500; }
.day-tab:hover { color:var(--text); }
.tab-sub { font-size:9.5px; opacity:0.6; display:block; }

main { padding:1rem 1rem 5.5rem; max-width:480px; margin:0 auto; }
.day-section { display:none; }
.day-section.active { display:block; }

.day-header { display:flex; align-items:center; gap:9px; margin:0.3rem 0 1.1rem; }
.day-badge { font-size:10px; font-weight:700; letter-spacing:0.08em; padding:3px 9px; border-radius:4px; flex-shrink:0; }
.day-badge.transit { background:var(--blue-dim); color:var(--blue); border:1px solid var(--blue-border); }
.day-badge.normal  { background:var(--green-dim); color:var(--green); border:1px solid var(--green-border); }
.day-title  { font-size:14px; font-weight:500; color:var(--text); flex:1; }
.theme-tag  { font-size:10px; color:var(--text3); padding:2px 7px; border-radius:8px; background:var(--bg4); border:1px solid var(--border); flex-shrink:0; }

.event-list { display:flex; flex-direction:column; }
.event-item { display:flex; min-height:3.8rem; }
.tl-col { width:52px; flex-shrink:0; position:relative; display:flex; flex-direction:column; align-items:center; }
.tl-line { position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); width:1px; background:var(--border); }
.tl-time { position:relative; z-index:2; font-size:10px; color:var(--text3); padding-top:0.6rem; line-height:1.2; text-align:center; width:100%; }
.tl-dot { position:absolute; top:2.2rem; left:50%; transform:translateX(-50%); width:9px; height:9px; border-radius:50%; z-index:1; }
.tl-dot.flight  { background:var(--blue-dim);   border:2px solid var(--blue); }
.tl-dot.sight   { background:var(--green-dim);  border:2px solid var(--green); }
.tl-dot.food    { background:var(--orange-dim); border:2px solid var(--orange); }
.tl-dot.hotel   { background:var(--purple-dim); border:2px solid var(--purple); }
.tl-dot.drive   { background:var(--red-dim);    border:2px solid var(--red); }
.tl-dot.default { background:var(--bg4);        border:2px solid var(--text3); }

.event-card {
  flex:1; border-radius:10px; padding:0;
  margin:0.4rem 0 0.4rem 8px; overflow:hidden;
  border-left-width:3px; border-left-style:solid;
}
.event-card.flight  { background:var(--blue-dim);   border-color:var(--blue);   border-top:1px solid var(--blue-border);   border-right:1px solid var(--blue-border);   border-bottom:1px solid var(--blue-border); }
.event-card.sight   { background:var(--green-dim);  border-color:var(--green);  border-top:1px solid var(--green-border);  border-right:1px solid var(--green-border);  border-bottom:1px solid var(--green-border); }
.event-card.food    { background:var(--orange-dim); border-color:var(--orange); border-top:1px solid var(--orange-border); border-right:1px solid var(--orange-border); border-bottom:1px solid var(--orange-border); }
.event-card.hotel   { background:var(--purple-dim); border-color:var(--purple); border-top:1px solid var(--purple-border); border-right:1px solid var(--purple-border); border-bottom:1px solid var(--purple-border); }
.event-card.drive   { background:var(--red-dim);    border-color:var(--red);    border-top:1px solid var(--red-border);    border-right:1px solid var(--red-border);    border-bottom:1px solid var(--red-border); }
.event-card.default { background:var(--bg2);        border-color:var(--text3);  border-top:1px solid var(--border);        border-right:1px solid var(--border);        border-bottom:1px solid var(--border); }

.card-img { width:100%; height:130px; object-fit:cover; display:block; }
.card-body { padding:0.7rem 0.95rem 0.8rem; }

.ev-type { font-size:10px; letter-spacing:0.09em; text-transform:uppercase; font-weight:500; margin-bottom:2px; }
.event-card.flight  .ev-type { color:var(--blue); }
.event-card.sight   .ev-type { color:var(--green); }
.event-card.food    .ev-type { color:var(--orange); }
.event-card.hotel   .ev-type { color:var(--purple); }
.event-card.drive   .ev-type { color:var(--red); }
.event-card.default .ev-type { color:var(--text2); }

.ev-title   { font-size:14px; font-weight:500; color:var(--text); line-height:1.4; }
.ev-en      { font-size:11px; color:var(--text3); margin-top:1px; }
.ev-address { font-size:11px; color:var(--text2); margin-top:4px; display:flex; align-items:flex-start; gap:4px; }
.ev-address::before { content:'📍'; font-size:10px; margin-top:1px; flex-shrink:0; }
.ev-hint    { font-size:12px; color:var(--text2); margin-top:5px; line-height:1.55; }
.ev-link    { display:inline-flex; align-items:center; gap:4px; margin-top:7px; font-size:11px; color:var(--blue); text-decoration:none; }
.ev-link:hover { text-decoration:underline; }

.ev-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; margin-top:6px; margin-right:4px; }
.tag-warn  { background:rgba(150,88,10,0.12); color:var(--orange); border:1px solid var(--orange-border); }
.tag-info  { background:var(--blue-dim);   color:var(--blue);   border:1px solid var(--blue-border); }
.tag-brick { background:var(--green-dim);  color:var(--green);  border:1px solid var(--green-border); font-weight:500; }
.tag-note  { background:var(--bg4); color:var(--text2); border:1px solid var(--border2); }

.people { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
.person { font-size:10px; padding:2px 8px; border-radius:10px; }
.event-card.flight  .person { background:rgba(46,74,107,0.1);  color:var(--blue);   border:1px solid var(--blue-border); }
.event-card.sight   .person { background:rgba(139,58,42,0.1);  color:var(--green);  border:1px solid var(--green-border); }
.event-card.food    .person { background:rgba(150,88,10,0.1);  color:var(--orange); border:1px solid var(--orange-border); }
.event-card.hotel   .person { background:rgba(30,58,90,0.1);   color:var(--purple); border:1px solid var(--purple-border); }
.event-card.drive   .person { background:rgba(196,97,74,0.1);  color:var(--red);    border:1px solid var(--red-border); }
.event-card.default .person { background:var(--bg4); color:var(--text2); border:1px solid var(--border2); }
.person.highlight   { font-weight:500; border-width:1.5px !important; }

footer {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--bg2); border-top:1px solid var(--border);
  padding:0.45rem 0.4rem; display:flex; gap:3px; z-index:100;
  box-shadow:0 -1px 4px rgba(0,0,0,0.05);
  overflow-x:auto; scrollbar-width:none;
}
footer::-webkit-scrollbar { display:none; }
.ft-btn {
  flex-shrink:0; min-width:38px;
  background:transparent; border:1px solid var(--border);
  border-radius:7px; color:var(--text2); font-size:9px;
  padding:4px 3px; cursor:pointer; font-family:'Noto Sans TC',sans-serif;
  transition:all 0.15s; line-height:1.35; text-align:center;
}
.ft-btn:hover { background:var(--bg3); color:var(--text); border-color:var(--border2); }
.ft-btn.active { background:var(--blue-dim); color:var(--blue); border-color:var(--blue-border); font-weight:500; }
</style>
</head>
<body>

<header>
  <div class="header-label">Family Journey · Summer 2026</div>
  <h1 id="trip-title"></h1>
  <div class="header-sub" id="trip-subtitle"></div>
  <div class="badges" id="trip-badges"></div>
  <div style="position:relative;margin-top:0.9rem;">
    <a id="sheets-link" href="#" target="_blank" rel="noopener"
       style="font-size:11px;color:rgba(200,216,232,0.75);text-decoration:none;border:1px solid rgba(255,255,255,0.2);border-radius:14px;padding:3px 11px;display:inline-flex;align-items:center;gap:5px;">
      📊 原始資料
    </a>
  </div>
</header>

<div class="days-nav" id="days-nav"></div>
<main id="main"></main>

<footer id="footer"></footer>

<!-- 先載入資料，再執行渲染 -->
<script src="data.js"></script>
<script>
// ── 渲染函式 ──────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function renderHeader() {
  document.getElementById('trip-title').textContent    = TRIP.title;
  document.getElementById('trip-subtitle').textContent = TRIP.subtitle;
  if (TRIP.sheetsUrl) {
    document.getElementById('sheets-link').href = TRIP.sheetsUrl;
  }
  const badgesEl = document.getElementById('trip-badges');
  TRIP.badges.forEach(b => {
    badgesEl.innerHTML += `<div class="badge badge-${esc(b.style)}"><div class="dot"></div>${esc(b.text)}</div>`;
  });
}

function renderEvent(ev) {
  const imgHTML  = ev.img     ? `<img class="card-img" src="${esc(ev.img)}" alt="${esc(ev.title)}" loading="lazy" onerror="this.style.display='none'">` : '';
  const enHTML   = ev.en      ? `<div class="ev-en">${esc(ev.en)}</div>` : '';
  const addrHTML = ev.address ? `<div class="ev-address">${esc(ev.address)}</div>` : '';
  const hintHTML = ev.hint    ? `<div class="ev-hint">${esc(ev.hint)}</div>` : '';
  const linkHTML = ev.link    ? `<a class="ev-link" href="${esc(ev.link.url)}" target="_blank" rel="noopener">${esc(ev.link.label)}</a>` : '';

  const tagsHTML = (ev.tags || []).map(t =>
    `<span class="ev-tag ${esc(t.cls)}">${esc(t.text)}</span>`
  ).join('');

  const peopleHTML = (ev.people || []).length ? `<div class="people">${
    (ev.people).map(p => {
      const isMichael = p.endsWith('*');
      const name = isMichael ? p.slice(0,-1) : p;
      return `<span class="person${isMichael ? ' highlight' : ''}">${esc(name)}</span>`;
    }).join('')
  }</div>` : '';

  return `
    <div class="event-item">
      <div class="tl-col">
        <div class="tl-line"></div>
        <div class="tl-dot ${esc(ev.dotType)}"></div>
        <div class="tl-time">${esc(ev.time)}</div>
      </div>
      <div class="event-card ${esc(ev.type)}">
        ${imgHTML}
        <div class="card-body">
          <div class="ev-type">${esc(ev.evType)}</div>
          <div class="ev-title">${esc(ev.title)}</div>
          ${enHTML}${addrHTML}${hintHTML}${tagsHTML}${peopleHTML}${linkHTML}
        </div>
      </div>
    </div>`;
}

function renderDays() {
  const nav    = document.getElementById('days-nav');
  const main   = document.getElementById('main');
  const footer = document.getElementById('footer');

  TRIP.days.forEach((day, i) => {
    // top tab — 優先用 theme 作為副標
    const tabSub = day.theme || day.tabSub;
    nav.innerHTML += `<div class="day-tab${i===0?' active':''}" onclick="go(${i})">${esc(day.tab)}<span class="tab-sub">${esc(tabSub)}</span></div>`;

    // day section
    const eventsHTML = (day.events || []).map(renderEvent).join('');
    main.innerHTML += `
      <div class="day-section${i===0?' active':''}" id="d${i}">
        <div class="day-header">
          <span class="day-badge ${esc(day.badge)}">${esc(day.badgeLabel)}</span>
          <span class="day-title">${esc(day.title)}</span>
          <span class="theme-tag">${esc(day.theme)}</span>
        </div>
        <div class="event-list">${eventsHTML}</div>
      </div>`;

    // footer button — 同樣用 theme
    footer.innerHTML += `<button class="ft-btn${i===0?' active':''}" onclick="go(${i})">${esc(day.tab)}<br>${esc(tabSub)}</button>`;
  });
}

function go(i) {
  document.querySelectorAll('.day-section').forEach((el,j) => el.classList.toggle('active', j===i));
  document.querySelectorAll('.day-tab').forEach((el,j)     => el.classList.toggle('active', j===i));
  document.querySelectorAll('.ft-btn').forEach((el,j)      => el.classList.toggle('active', j===i));
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── 初始化 ──
renderHeader();
renderDays();
</script>
</body>
</html>
